# nginx untuk frontend antrianMadani: berkas statis + proxy ke backend (satu pintu untuk TV).
# Nama host "antrian-backend" adalah nama service di docker-compose.yml.

upstream antrian_backend {
    server antrian-backend:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Aset Vite punya hash di namanya: aman dicache lama.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Klip suara (notif, angka) dari public/suara
    location /suara/ {
        expires 7d;
        try_files $uri =404;
    }

    # Server-Sent Events: jangan di-buffer, koneksi boleh terbuka lama.
    location /antrian/events {
        proxy_pass http://antrian_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding off;
    }

    # API dan berkas dari backend
    location ~ ^/(antrian|info|farmasi|foto|suara-nama|health)(/|$) {
        proxy_pass http://antrian_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # SPA: route seperti /display/U0004,U0005 atau /info/bed dilayani index.html.
    # index.html sendiri tidak boleh dicache supaya rilis baru langsung terbaca TV.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
